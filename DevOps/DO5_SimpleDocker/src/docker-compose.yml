services:
  server:
    build: .
    networks:
      - internal

  nginx-proxy:
    image: nginx:latest
    ports:
      - "80:8080"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf
    networks:
      - internal
    depends_on:
      - server

networks:
  internal:
    driver: bridge
